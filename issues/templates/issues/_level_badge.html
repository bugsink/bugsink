{% comment %}Small colored badge for a log level. Expects `level` (the lowercase SDK level string).{% endcomment %}
<span class="inline-block rounded px-1.5 py-0.5 text-xs font-semibold leading-none align-middle {% if level == "fatal" %}bg-red-600 text-white dark:bg-red-700 dark:text-red-50{% elif level == "error" %}bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200{% elif level == "warning" %}bg-orange-100 text-orange-800 dark:bg-orange-900 dark:text-orange-200{% elif level == "info" %}bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200{% else %}bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-200{% endif %}">{{ level|upper }}</span>

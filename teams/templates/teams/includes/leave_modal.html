{% load i18n %}

<!-- Leave Confirmation Modal -->
<div id="leaveModal" class="hidden fixed inset-0 bg-slate-600/50 dark:bg-slate-900/50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative p-6 border border-slate-300 dark:border-slate-600 w-96 shadow-lg rounded-md bg-white dark:bg-slate-900">
        <div class="text-center m-4">
            <h3 class="text-2xl font-semibold text-slate-800 dark:text-slate-100 mt-3 mb-4">{% translate "Leave Team" %}</h3>
            <div class="mt-4 mb-6">
                <p class="text-slate-700 dark:text-slate-300">
                    {% translate "Are you sure you want to leave this team?" %}
                </p>
            </div>
            <div class="flex items-center justify-center space-x-4 mb-4">
                <button id="cancelLeave" class="text-cyan-500 dark:text-cyan-300 font-bold">{% translate "Cancel" %}</button>
                <form method="post" action="." id="leaveForm">
                    {% csrf_token %}
                    <input type="hidden" name="action" id="leaveAction" value="">
                    <button type="submit" class="font-bold py-2 px-4 rounded-sm bg-red-500 dark:bg-red-700 text-white border-2 border-red-600 dark:border-red-400 hover:bg-red-600 dark:hover:bg-red-800 active:ring-3">{% translate "Leave" %}</button>
                </form>
            </div>
        </div>
    </div>
</div>

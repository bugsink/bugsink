{% extends "barest_base.html" %}
{% load static %}
{% load tailwind_forms %}
{% load i18n %}

{% block title %}Resend confirmation · {{ site_title }}{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center p-4" style="background: radial-gradient(ellipse at 50% 30%, var(--glow-primary), transparent 55%), var(--color-base-100);">
    <div class="card bg-base-100 border border-base-300 shadow-xl w-full max-w-md relative">
        <div class="absolute left-1/2 -translate-x-1/2 -translate-y-1/2">
            <div class="avatar">
                <div class="w-16 rounded-full bg-base-200 p-3 ring ring-base-300">
                    <a href="{{ script_prefix }}/">
                        <img src="{% static 'images/bugsink-logo.png' %}" class="dark:hidden" alt="Bugsink logo">
                        <img src="{% static 'images/bugsink-logo-dark.png' %}" class="hidden dark:block" alt="Bugsink logo">
                    </a>
                </div>
            </div>
        </div>

        <div class="card-body pt-16">

            <form method="post" action=".">
                {% csrf_token %}

                {% tailwind_formfield_implicit form.email %}

                <button class="btn btn-neutral btn-block">{% translate "Reset password" %}</button>
            </form>

            <div class="mt-4">
                <a href="{% url 'login' %}" class="link">{% translate "Log in instead" %}</a>
            </div>
        </div>

    </div>
</div>

{% endblock %}

<div id="sdk-setup-event-status"
     class="grid transition-[grid-template-rows,opacity,margin-top] duration-300 ease-out motion-reduce:transition-none"
     style="grid-template-rows: 0fr; opacity: 0; margin-top: 0; visibility: hidden;"
     data-status-url="{% url 'project_sdk_setup_status' project_pk=project.pk %}"
     data-event-count="{{ project.digested_event_count }}"
     role="status"
     aria-live="polite"
     aria-atomic="true"
     aria-hidden="true">
    <div class="min-h-0 overflow-hidden">
        <div class="bg-cyan-50 dark:bg-cyan-900 border-2 border-cyan-800 dark:border-cyan-400 p-4 rounded-lg">
            <span class="font-bold" data-event-status-message></span>
            <a href="{% url 'issue_list_open' project_pk=project.pk %}" class="font-bold underline">View the list of open issues.</a>
        </div>
    </div>
</div>
